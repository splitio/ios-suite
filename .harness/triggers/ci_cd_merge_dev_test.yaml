trigger:
  name: ci-cd-merge-dev-test
  identifier: ci_cd_merge_dev_test
  enabled: true
  stagesToExecute: []
  description: Fires on PR merge into dev_test; pipeline-level `when` gates actual release work to release/* source branches.
  tags: {}
  orgIdentifier: PROD
  projectIdentifier: Harness_Split
  pipelineIdentifier: ci_cd
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: PullRequest
        spec:
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: dev_test
          headerConditions: []
          repoName: ios-suite-dev
          actions:
            - Merge
  pipelineBranchName: <+trigger.branch>
  inputSetRefs:
    - ci_cd_inputset
