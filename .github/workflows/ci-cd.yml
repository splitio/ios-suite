      - name: Checkout example-ios repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: splitio/example-ios
          token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          path: example-ios
      
      - name: Modify test_release.sh to keep branch
        continue-on-error: true
        run: |
          cd example-ios
          # Comment out the line that deletes the branch
          sed -i 's/git branch -D ${test_branch}/# git branch -D ${test_branch}/' test_release.sh
          # Comment out the line that opens the browser
          sed -i 's/open -a "Google Chrome"/# open -a "Google Chrome"/' test_release.sh
          cat test_release.sh
      
      - name: Update example-ios files
        id: update-example-ios
        continue-on-error: true
        run: |
          cd example-ios
          # Set GitHub identity
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          chmod +x ./test_release.sh
          # Run the script but don't let it push the branch
          sed -i 's/git push -u origin ${test_branch}/echo "Skipping push, will be handled by create-pull-request action"/' test_release.sh
          ./test_release.sh ${SUITE_VERSION} ${SDK_VERSION} ${RUM_VERSION}
        env:
          SUITE_VERSION: ${{ needs.build.outputs.version }}
          SDK_VERSION: ${{ needs.build.outputs.sdk_version }}
          RUM_VERSION: ${{ needs.build.outputs.rum_version }}
      
      - name: Create Example iOS PR
        id: create-example-ios-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          path: example-ios
          commit-message: "Update example to use SDK version ${{ needs.build.outputs.sdk_version }}"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: test_release_${{ needs.build.outputs.sdk_version }}
          title: "Update example to use SDK version ${{ needs.build.outputs.sdk_version }}"
          body: |
            This PR updates the example to use SDK version ${{ needs.build.outputs.sdk_version }}.
            
            Related to Suite version ${{ needs.build.outputs.version }} and RUM version ${{ needs.build.outputs.rum_version }}.
          base: master
      
      - name: Add Example iOS PR URL as comment
        if: github.event_name == 'pull_request' && steps.create-example-ios-pr.outputs.pull-request-url != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Example iOS update PR created: ${process.env.EXAMPLE_IOS_PR_URL}`
            })
        env:
          EXAMPLE_IOS_PR_URL: ${{ steps.create-example-ios-pr.outputs.pull-request-url }}
