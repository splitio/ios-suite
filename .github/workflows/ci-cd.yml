name: Build xcframework

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - dev_test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: startsWith(github.head_ref, 'release/') && github.event.pull_request.merged == true
    runs-on: macos-15
    outputs:
      zip_file_name: ${{ steps.zip_file.outputs.zip_file_name }}
      sdk_version: ${{ steps.extract-sdk-version.outputs.SDK_VERSION }}
      rum_version: ${{ steps.extract-rum-version.outputs.RUM_VERSION }}
      version: ${{ steps.extract_version.outputs.VERSION }}

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
        
    - name: Extract version from branch name
      id: extract_version
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # For PR merges
          BRANCH_NAME="${{ github.head_ref }}"
        else
          # For direct pushes
          BRANCH_NAME="${{ github.ref_name }}"
        fi
        
        # Extract version from branch name
        VERSION=$(echo "$BRANCH_NAME" | sed 's/release\///')
        
        echo "Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
        
    - name: Create Tag
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        echo "Creating tag ${{ steps.extract_version.outputs.VERSION }}"
        git tag -a "${{ steps.extract_version.outputs.VERSION }}" -m "Release ${{ steps.extract_version.outputs.VERSION }}"
        git push origin "${{ steps.extract_version.outputs.VERSION }}"

    - name: Set artifact name
      id: set-artifact-name
      run: echo "ARTIFACT_NAME=iOSSplitSuite" >> $GITHUB_OUTPUT

    - name: Set zip name
      id: set-zip-name
      run: echo "ZIP_NAME=${{ steps.set-artifact-name.outputs.ARTIFACT_NAME }}_${{ steps.extract_version.outputs.VERSION }}.zip" >> $GITHUB_OUTPUT

    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract iOS SDK version
      id: extract-sdk-version
      run: |
        SDK_VERSION=$(cat iOSSplitSuite.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | jq -r '.pins[] | select(.identity == "ios-client") | .state.version')
        echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_OUTPUT
        echo "Found iOS SDK version: $SDK_VERSION"
        
    - name: Extract RUM version
      id: extract-rum-version
      run: |
        RUM_VERSION=$(cat iOSSplitSuite.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | jq -r '.pins[] | select(.identity == "ios-rum") | .state.version')
        echo "RUM_VERSION=$RUM_VERSION" >> $GITHUB_OUTPUT
        echo "Found iOS RUM version: $RUM_VERSION"

    - name: Generate xcframework zip
      run: ./scripts/generate_xcframework ${{ steps.extract_version.outputs.VERSION }}

    - name: Upload xcframework zip and checksum
      uses: actions/upload-artifact@v4
      with:
        name: xcframework-artifacts
        path: |
          xcframework/${{ steps.set-zip-name.outputs.ZIP_NAME }}
          xcframework/checksum
        retention-days: 1

    - id: zip_file
      name: Setting output zip name
      run: echo "zip_file_name=${{ steps.set-zip-name.outputs.ZIP_NAME }}" >> "$GITHUB_OUTPUT"

  upload-prod:
    name: Upload assets
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        environment:
          - prod
        include:
          - environment: prod
            account_id: "825951051969"
            bucket: split-public

    steps:
      - env:
          zip_file_name: ${{ needs.build.outputs.zip_file_name }}
        run: echo "zip_name=${{ env.zip_file_name }}" >> $GITHUB_ENV

      - name: Download xcframework artifacts
        uses: actions/download-artifact@v4
        with:
          name: xcframework-artifacts
          path: dist

      - name: Display structure of assets
        run: ls -R
        working-directory: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gha-public-assets-role
          aws-region: us-east-1

      - name: "Upload dist/${{ env.zip_name }} to S3"
        run: aws s3 cp $SOURCE s3://$BUCKET/$DESTINATION $ARGS
        env:
          BUCKET: ${{ matrix.bucket }}
          SOURCE: dist/${{ env.zip_name }}
          DESTINATION: ios-suite/${{ env.zip_name }}
          ARGS: --acl public-read --follow-symlinks --cache-control max-age=31536000,public

  update-package:
    name: Update Package.swift
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
    
    steps:
      - name: Set zip name
        id: set-zip-name
        run: echo "ZIP_NAME=${{ needs.build.outputs.zip_file_name }}" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: extract-version
        run: echo "VERSION=$(echo ${{ steps.set-zip-name.outputs.ZIP_NAME }} | sed 's/iOSSplitSuite_\(.*\)\.zip/\1/')" >> $GITHUB_OUTPUT
      
      - name: Determine target branch
        id: target-branch
        run: |
          if [[ "${{ steps.extract-version.outputs.VERSION }}" == *"-rc"* ]]; then
            echo "TARGET_BRANCH=dev_test" >> $GITHUB_OUTPUT
          else
            echo "TARGET_BRANCH=main" >> $GITHUB_OUTPUT
          fi
      
      - name: Download xcframework artifacts for Package.swift update
        uses: actions/download-artifact@v4
        with:
          name: xcframework-artifacts
          path: dist
      
      - name: Read checksum
        id: read-checksum
        run: echo "CHECKSUM=$(cat dist/checksum)" >> $GITHUB_OUTPUT
      
      - name: Checkout ios-suite repo
        uses: actions/checkout@v4
        with:
          repository: splitio/ios-suite
          token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          path: ios-suite
      
      - name: Update Package.swift
        run: |
          cd ios-suite
          sed -i -E "s|url: \"https://cdn\.split\.io/ios-suite/iOSSplitSuite_[0-9]+(\.[0-9]+)*(-rc[0-9]+)?\.zip\"|url: \"https://cdn.split.io/ios-suite/iOSSplitSuite_${{ steps.extract-version.outputs.VERSION }}.zip\"|g" Package.swift
          sed -i -E "s/checksum: \"[a-f0-9]+\"/checksum: \"${{ steps.read-checksum.outputs.CHECKSUM }}\"/g" Package.swift
          cat Package.swift
      
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          path: ios-suite
          commit-message: "Update Suite version to ${{ steps.extract-version.outputs.VERSION }}"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: release/${{ steps.extract-version.outputs.VERSION }}
          delete-branch: true
          title: "Update Suite version to ${{ steps.extract-version.outputs.VERSION }}"
          body: |
            This PR updates the Suite version to ${{ steps.extract-version.outputs.VERSION }}.

          base: ${{ steps.target-branch.outputs.TARGET_BRANCH }}
      
      - name: Add Package.swift PR URL as comment
        if: github.event_name == 'pull_request' && steps.create-pr.outputs.pull-request-url != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Package.swift update PR created: ${process.env.PR_URL}`
            })
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}

      # - name: Checkout example-ios-objc repo
